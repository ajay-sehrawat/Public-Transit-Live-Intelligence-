apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: transit-system
  labels:
    app: zookeeper
spec:
  clusterIP: None
  ports:
  - port: 2888
    name: peer
  - port: 3888
    name: leader-election
  selector:
    app: zookeeper
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: transit-system
  labels:
    app: zookeeper
spec:
  type: ClusterIP
  ports:
  - port: 2181
    name: client
    targetPort: 2181
  selector:
    app: zookeeper

