apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transit-public-ingress
  namespace: transit-system
  annotations:
    kubernetes.io/ingress.class: "gce" # Google Cloud HTTP(S) Load Balancer
    ingress.gcp.kubernetes.io/pre-shared-cert: "transit-ssl-cert"
spec:
  rules:
  - http:
      paths:
      - path: /api/v1/telemetry
        pathType: Prefix
        backend:
          service:
            name: gps-ingestion-service
            port:
              number: 8002
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transport-analytics-service
            port:
              number: 8008

