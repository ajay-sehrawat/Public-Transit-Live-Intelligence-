apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: transit-system
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        environment: production
        cluster: gke-transit-s11-prod

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "transit-vehicle-registry"
        metrics_path: /metrics
        static_configs:
          - targets: ["vehicle-registry-service.transit-system.svc.cluster.local:8001"]

      - job_name: "transit-gps-ingestion"
        metrics_path: /metrics
        static_configs:
          - targets: ["gps-ingestion-service.transit-system.svc.cluster.local:8002"]

      - job_name: "transit-route-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["route-service.transit-system.svc.cluster.local:8003"]

      - job_name: "transit-event-adapter"
        metrics_path: /metrics
        static_configs:
          - targets: ["event-adapter-service.transit-system.svc.cluster.local:8004"]

      - job_name: "transit-passenger-demand"
        metrics_path: /metrics
        static_configs:
          - targets: ["passenger-demand-service.transit-system.svc.cluster.local:8006"]

      - job_name: "transit-transport-analytics"
        metrics_path: /metrics
        static_configs:
          - targets: ["transport-analytics-service.transit-system.svc.cluster.local:8008"]

      - job_name: "zookeeper-cluster"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "zookeeper-0.zookeeper-headless.transit-system.svc.cluster.local:7000"
              - "zookeeper-1.zookeeper-headless.transit-system.svc.cluster.local:7000"
              - "zookeeper-2.zookeeper-headless.transit-system.svc.cluster.local:7000"

  alert_rules.yml: |
    groups:
      - name: transit_system_alerts
        rules:
          - alert: HighGpsIngestionLatency
            expr: rate(transit_http_request_duration_seconds_sum[2m]) / rate(transit_http_request_duration_seconds_count[2m]) > 0.5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "GPS Ingestion Service experiencing high p95 latency (> 500ms)"

          - alert: ActiveDelaySpike
            expr: transport_analytics_delay_alerts_total > 5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Severe transit system delay spike (> 5 concurrent bus delays)"

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 > 2
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Transit pod restart rate exceeds threshold"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-server
  namespace: transit-system
  labels:
    app: prometheus
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: monitoring
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--web.console.libraries=/etc/prometheus/console_libraries"
          - "--web.console.templates=/etc/prometheus/consoles"
          - "--storage.tsdb.retention.time=7d"
          - "--web.enable-lifecycle"
        ports:
        - containerPort: 9090
          name: web
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: prometheus-config-volume
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: transit-system
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: web
  selector:
    app: prometheus
