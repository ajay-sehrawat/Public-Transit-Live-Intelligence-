apiVersion: apps/v1
kind: Deployment
metadata:
  name: passenger-demand
  namespace: transit-system
  labels:
    app: passenger-demand
    tier: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: passenger-demand
  template:
    metadata:
      labels:
        app: passenger-demand
        tier: microservice
    spec:
      containers:
      - name: passenger-demand
        image: gcr.io/transit-s11-prod/passenger-demand:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8006
          name: http
        envFrom:
        - configMapRef:
            name: transit-global-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: passenger-demand-service
  namespace: transit-system
  labels:
    app: passenger-demand
spec:
  type: ClusterIP
  ports:
  - port: 8006
    name: http
    targetPort: 8006
  selector:
    app: passenger-demand

