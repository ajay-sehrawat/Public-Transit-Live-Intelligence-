apiVersion: apps/v1
kind: Deployment
metadata:
  name: gps-ingestion
  namespace: transit-system
  labels:
    app: gps-ingestion
    tier: critical-ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gps-ingestion
  template:
    metadata:
      labels:
        app: gps-ingestion
        tier: critical-ingress
    spec:
      containers:
      - name: gps-ingestion
        image: gcr.io/transit-s11-prod/gps-ingestion:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        envFrom:
        - configMapRef:
            name: transit-global-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gps-ingestion-service
  namespace: transit-system
  labels:
    app: gps-ingestion
spec:
  type: ClusterIP
  ports:
  - port: 8002
    name: http
    targetPort: 8002
  selector:
    app: gps-ingestion

